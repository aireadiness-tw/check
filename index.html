<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="10 分鐘自評：看看你的公司導入 AI 前準備到哪裡。">
<title>中小企業 AI 準備度自評｜零九顧問</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 與首頁同一套視覺：鋼藍九格＋訊號黃一格。版面像一張工廠點檢表：左邊是點檢進度，右邊逐題勾選，結果像檢驗報告。 */
:root{
  --bg:#f4f6f6; --alt:#e7edee; --paper:#ffffff; --ink:#14232c; --muted:#56656e; --line:#d2dbdf;
  --accent:#1b6782; --accent-ink:#ffffff; --accent-soft:#dcebf1; --cell:#e3eef2;
  --signal:#f0a419; --signal-ink:#2b1d00; --signal-soft:#fdf1d8;
  --deep:#13303d; --deep-ink:#e9f1f4; --deep-muted:#a9bfc8;
  --warn:#b45d0a; --ok:#2f7d4f; --low:#b3402e;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --nav:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --alt:#142128; --paper:#18262e; --ink:#e3ebef; --muted:#9db0ba; --line:#2a3a43;
  --accent:#62b6d4; --accent-ink:#06141a; --accent-soft:#1b3442; --cell:#1a2f3a;
  --signal:#f5b53c; --signal-ink:#231700; --signal-soft:#3a2d12;
  --deep:#0b2430; --deep-ink:#e3ebef; --deep-muted:#9db6c1;
  --warn:#e3964a; --ok:#6cc08f; --low:#e47a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --alt:#142128; --paper:#18262e; --ink:#e3ebef; --muted:#9db0ba; --line:#2a3a43;
  --accent:#62b6d4; --accent-ink:#06141a; --accent-soft:#1b3442; --cell:#1a2f3a;
  --signal:#f5b53c; --signal-ink:#231700; --signal-soft:#3a2d12;
  --deep:#0b2430; --deep-ink:#e3ebef; --deep-muted:#9db6c1;
  --warn:#e3964a; --ok:#6cc08f; --low:#e47a66; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav) + 16px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;margin:0;overflow-x:hidden}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,.btn:focus-visible,.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}body{font-size:16px}}

.topbar{position:fixed;inset:0 0 auto;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{height:var(--nav);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:var(--ink);text-decoration:none;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
.topbar .btn{margin-left:auto;padding:9px 18px;font-size:15px;white-space:nowrap}
@media (max-width:380px){.brand span{font-size:17px}.topbar .btn{padding:8px 12px}}

.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;text-decoration:none;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:8px;cursor:pointer;line-height:1.3}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

.intro-band{background:var(--alt);padding-top:calc(var(--nav) + env(safe-area-inset-top,0px) + 28px);padding-bottom:48px}
.intro-band .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:56px;align-items:center}
@media (max-width:900px){.intro-band .wrap{grid-template-columns:1fr;gap:24px}.sheet-art{display:none}}
.back{display:inline-block;margin-bottom:18px;padding-block:4px;font-size:15px;color:var(--accent);text-decoration:none;font-weight:500}
.back:hover{text-decoration:underline}
.eyebrow{font-size:15px;font-weight:700;color:var(--accent)}
h1{font-size:clamp(28px,4vw,48px);line-height:1.22;font-weight:900;margin:8px 0 16px;text-wrap:balance}
.sub{font-size:18px;font-weight:500;margin:0 0 10px;max-width:40em}
.intro{color:var(--muted);max-width:40em;margin:0}
.sheet-art{width:100%;height:auto;max-width:400px;justify-self:end}

.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:56px;align-items:start;padding-block:48px 80px}
.side{position:sticky;top:calc(var(--nav) + env(safe-area-inset-top,0px) + 24px);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.bar{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.bar .btn{grid-column:1/-1}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.count{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#dimnav{list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:2px}
#dimnav a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}
#dimnav a:hover{background:var(--accent-soft)}
#dimnav .code{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
#dimnav .dc{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#dimnav .dc.done{color:var(--ok)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:0;padding-top:0}
  .side{position:sticky;top:calc(var(--nav) + env(safe-area-inset-top,0px));z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0;border-width:0 0 1px;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
  .bar{grid-template-columns:1fr auto auto}
  .bar .btn{grid-column:auto;padding:7px 14px;font-size:15px}
  #dimnav{display:none}
}

section.dim{margin-top:48px;scroll-margin-top:calc(var(--nav) + 80px)}
section.dim:first-child{margin-top:0}
@media (max-width:900px){section.dim:first-child{margin-top:28px}}
.dim-head{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.dim-head .code{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:16px;font-weight:600;flex:none}
.dim-head h2{font-size:24px;margin:0}
.dim-desc{color:var(--muted);font-size:15px;margin:10px 0 0}
.q{padding-block:22px;border-bottom:1px solid var(--line)}
.q p{margin:0 0 12px;font-weight:700;font-size:17px}
.q .qn{font-family:var(--mono);font-size:14px;color:var(--accent);margin-right:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr;gap:8px}}
.opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:15px;line-height:1.55;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}

#result{margin-top:48px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px max(20px,3vw);border-top:6px solid var(--signal)}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.score .num{font-family:var(--mono);font-size:64px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.score .of{font-family:var(--mono);color:var(--muted)}
.band{font-size:26px;margin:6px 0 8px;font-weight:900}
.rows{display:grid;gap:18px;margin:28px 0}
.row{display:grid;grid-template-columns:8em 1fr 4.5em;gap:12px;align-items:center}
.row .name{font-weight:700}
.row .val{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%}
.fb{grid-column:1/-1;font-size:15px;color:var(--muted);margin:-6px 0 0;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;border:1px solid currentColor;margin-left:6px}
h3{font-size:19px;margin:28px 0 10px}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:8px}
.cta{margin-top:28px;padding:20px 22px;border-radius:12px;background:var(--signal-soft);border-left:6px solid var(--signal)}
.cta a{color:var(--accent);text-underline-offset:3px}
.note{font-size:14px;color:var(--muted);margin-top:16px}
@media (max-width:480px){.row{grid-template-columns:6.2em 1fr 4.2em}.score .num{font-size:52px}}

footer{background:var(--deep);color:var(--deep-muted);padding-block:36px;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
footer a{color:var(--deep-ink)}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 24px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}


/* ===== 流動寬度：與首頁同一套規則。內容約 92vw、2080px 封頂；
   1440px 以下字級與間距維持原樣，1440→2560px 線性放大。 ===== */
.wrap{width:min(100% - 2 * max(16px,4vw,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)),2080px);max-width:none;margin-inline:auto;padding-left:0;padding-right:0}
@media (max-width:900px){.side{margin-inline:calc(-1 * max(16px,4vw,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)));padding-inline:max(16px,4vw,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px))}}
@media (min-width:1441px){
  :root{--d:calc((100vw - 1440px) / 1120);--nav:clamp(68px,calc(68px + 12 * var(--d)),80px)}
  body{font-size:clamp(17px,calc(17px + 3 * var(--d)),20px)}
  .brand{font-size:clamp(19px,calc(19px + 4 * var(--d)),23px)}
  .btn{padding:clamp(10px,calc(10px + 4 * var(--d)),14px) clamp(20px,calc(20px + 8 * var(--d)),28px)}
  .topbar .btn{font-size:clamp(15px,calc(15px + 2 * var(--d)),17px);padding:10px 22px}
  .intro-band{padding-top:calc(var(--nav) + clamp(28px,calc(28px + 24 * var(--d)),52px));padding-bottom:clamp(48px,calc(48px + 32 * var(--d)),80px)}
  .intro-band .wrap{gap:clamp(56px,calc(56px + 64 * var(--d)),120px)}
  .back,.eyebrow{font-size:clamp(15px,calc(15px + 2 * var(--d)),17px)}
  h1{font-size:clamp(48px,calc(48px + 32 * var(--d)),80px)}
  .sub{font-size:clamp(18px,calc(18px + 4 * var(--d)),22px)}
  .sheet-art{max-width:clamp(400px,calc(400px + 160 * var(--d)),560px)}
  .layout{grid-template-columns:clamp(280px,calc(280px + 80 * var(--d)),360px) minmax(0,1fr);gap:clamp(56px,calc(56px + 40 * var(--d)),96px);padding-block:clamp(48px,calc(48px + 24 * var(--d)),72px) clamp(80px,calc(80px + 40 * var(--d)),120px)}
  .side{padding:clamp(22px,calc(22px + 8 * var(--d)),30px)}
  .count{font-size:clamp(14px,calc(14px + 2 * var(--d)),16px)}
  #dimnav a{font-size:clamp(15px,calc(15px + 3 * var(--d)),18px);grid-template-columns:28px 1fr auto;padding:8px 10px}
  #dimnav .code,#dimnav .dc{font-size:clamp(13px,calc(13px + 2 * var(--d)),15px)}
  .dim-head .code{width:clamp(36px,calc(36px + 8 * var(--d)),44px);height:clamp(36px,calc(36px + 8 * var(--d)),44px);font-size:clamp(16px,calc(16px + 3 * var(--d)),19px)}
  .dim-head h2{font-size:clamp(24px,calc(24px + 8 * var(--d)),32px)}
  .dim-desc{font-size:clamp(15px,calc(15px + 3 * var(--d)),18px)}
  .q{padding-block:clamp(22px,calc(22px + 8 * var(--d)),30px)}
  .q p{font-size:clamp(17px,calc(17px + 3 * var(--d)),20px)}
  .q .qn{font-size:clamp(14px,calc(14px + 2 * var(--d)),16px)}
  .opts{gap:clamp(10px,calc(10px + 4 * var(--d)),14px)}
  .opt{font-size:clamp(15px,calc(15px + 3 * var(--d)),18px);padding:clamp(12px,calc(12px + 4 * var(--d)),16px) clamp(14px,calc(14px + 4 * var(--d)),18px)}
  #result{padding:clamp(32px,calc(32px + 16 * var(--d)),48px) max(20px,3vw)}
  .score .num{font-size:clamp(64px,calc(64px + 24 * var(--d)),88px)}
  .band{font-size:clamp(26px,calc(26px + 8 * var(--d)),34px)}
  .row{grid-template-columns:10em 1fr 5em}
  .row .val{font-size:clamp(14px,calc(14px + 2 * var(--d)),16px)}
  .fb,.cta{font-size:clamp(15px,calc(15px + 3 * var(--d)),18px)}
  h3{font-size:clamp(19px,calc(19px + 4 * var(--d)),23px)}
  .note{font-size:clamp(14px,calc(14px + 2 * var(--d)),16px)}
  footer{font-size:clamp(15px,calc(15px + 2 * var(--d)),17px);padding-block:clamp(36px,calc(36px + 16 * var(--d)),52px)}
}
/* 題目欄夠寬時，四個選項排成一列 */
@media (min-width:1800px){.opts{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* 第二輪：跳過自評的預約連結 */
.skip{margin:14px 0 0;font-weight:500;max-width:40em}
.skip a{font-weight:700}
@media (min-width:1441px){.skip{font-size:clamp(17px,calc(17px + 3 * var(--d)),20px)}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="/" aria-label="零九顧問">
    <svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><g style="fill:var(--accent)"><rect x="0" y="0" width="4.6" height="10.6" rx="1.2"/><rect x="6.1" y="0" width="4.6" height="10.6" rx="1.2"/><rect x="12.2" y="0" width="4.6" height="10.6" rx="1.2"/><rect x="18.3" y="0" width="4.6" height="10.6" rx="1.2"/><rect x="24.4" y="0" width="4.6" height="10.6" rx="1.2"/><rect x="0" y="13" width="4.6" height="10.6" rx="1.2"/><rect x="6.1" y="13" width="4.6" height="10.6" rx="1.2"/><rect x="12.2" y="13" width="4.6" height="10.6" rx="1.2"/><rect x="18.3" y="13" width="4.6" height="10.6" rx="1.2"/></g><rect x="24.4" y="13" width="4.6" height="10.6" rx="1.2" style="fill:var(--signal)"/></svg>
    <span>零九顧問</span>
  </a>
  <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeiIEt4LeP-rIitegCDqyVF-HGJbCDBkQgci7QhBOAWPyaF8w/viewform" target="_blank" rel="noopener">預約 30 分鐘免費診斷</a>
</div></header>

<div class="intro-band"><div class="wrap">
  <header class="top">
    <a class="back" href="/">← 零九顧問：回到服務介紹</a>
    <div class="eyebrow">AI Readiness · 中小企業 20–150 人</div>
    <h1 id="title"></h1>
    <p class="sub">15 分鐘了解貴公司導入 AI 的準備程度，填完立即看到結果與建議。</p>
    <p class="intro" id="intro"></p>
    <p class="skip">也可以跳過自評，<a href="https://docs.google.com/forms/d/e/1FAIpQLSeiIEt4LeP-rIitegCDqyVF-HGJbCDBkQgci7QhBOAWPyaF8w/viewform" target="_blank" rel="noopener">直接預約免費診斷</a>。留電話也可以，我們會回撥。</p>
  </header>
  <svg class="sheet-art" viewBox="0 0 400 300" role="img" aria-label="示意圖：六個面向的點檢表">
    <rect x="40" y="10" width="320" height="280" rx="16" style="fill:var(--paper);stroke:var(--line)"/>
    <rect x="40" y="10" width="320" height="52" rx="16" style="fill:var(--deep)"/>
    <rect x="40" y="46" width="320" height="16" style="fill:var(--deep)"/>
    <text x="64" y="43" style="fill:#fff;font:700 16px var(--sans)">點檢表・6 個面向</text>
    <g style="font:600 13px var(--mono)">
      <g transform="translate(64,82)"><rect width="22" height="22" rx="5" style="fill:var(--accent)"/><text x="11" y="16" text-anchor="middle" style="fill:var(--accent-ink)">A</text><rect x="36" y="7" width="160" height="8" rx="4" style="fill:var(--line)"/><rect x="36" y="7" width="140" height="8" rx="4" style="fill:var(--accent)"/></g>
      <g transform="translate(64,116)"><rect width="22" height="22" rx="5" style="fill:var(--accent)"/><text x="11" y="16" text-anchor="middle" style="fill:var(--accent-ink)">B</text><rect x="36" y="7" width="160" height="8" rx="4" style="fill:var(--line)"/><rect x="36" y="7" width="96" height="8" rx="4" style="fill:var(--accent)"/></g>
      <g transform="translate(64,150)"><rect width="22" height="22" rx="5" style="fill:var(--accent)"/><text x="11" y="16" text-anchor="middle" style="fill:var(--accent-ink)">C</text><rect x="36" y="7" width="160" height="8" rx="4" style="fill:var(--line)"/><rect x="36" y="7" width="118" height="8" rx="4" style="fill:var(--accent)"/></g>
      <g transform="translate(64,184)"><rect width="22" height="22" rx="5" style="fill:var(--accent)"/><text x="11" y="16" text-anchor="middle" style="fill:var(--accent-ink)">D</text><rect x="36" y="7" width="160" height="8" rx="4" style="fill:var(--line)"/><rect x="36" y="7" width="70" height="8" rx="4" style="fill:var(--accent)"/></g>
      <g transform="translate(64,218)"><rect width="22" height="22" rx="5" style="fill:var(--accent)"/><text x="11" y="16" text-anchor="middle" style="fill:var(--accent-ink)">E</text><rect x="36" y="7" width="160" height="8" rx="4" style="fill:var(--line)"/><rect x="36" y="7" width="50" height="8" rx="4" style="fill:var(--accent)"/></g>
      <g transform="translate(64,252)"><rect width="22" height="22" rx="5" style="fill:var(--signal)"/><text x="11" y="16" text-anchor="middle" style="fill:var(--signal-ink)">F</text><rect x="36" y="7" width="160" height="8" rx="4" style="fill:var(--line)"/><rect x="36" y="7" width="30" height="8" rx="4" style="fill:var(--signal)"/></g>
    </g>
    <circle cx="310" cy="96" r="12" style="fill:var(--ok)"/><path d="M304 96l4 4 8-8" style="stroke:#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div></div>

<div class="wrap layout">
  <aside class="side" aria-label="填答進度">
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="count" id="count">0 / 21</span>
      <button class="btn" id="see" type="button" disabled>看結果</button>
    </div>
    <ol id="dimnav"></ol>
  </aside>
  <div>
    <form id="quiz"></form>
    <div class="actions">
      <button class="btn" id="see2" type="button" disabled>看結果</button>
      <button class="btn ghost" id="sample" type="button">填入範例答案</button>
      <button class="btn ghost" id="reset" type="button">全部清除</button>
    </div>
    <div id="result" hidden></div>

  DATA.dimensions.forEach(d => { const qs = DATA.questions.filter(q => q.dimension === d.id); const k = qs.filter(q => q.id in a).length;
    const el = document.querySelector(`.dc[data-dim="${d.id}"]`); el.textContent = `${k}/${qs.length}`; el.classList.toggle('done', k === qs.length); });
}
function level(avg){ return avg < 1 ? 'low' : avg < 2 ? 'mid' : 'high'; }
const lvColor = {low:'var(--low)', mid:'var(--warn)', high:'var(--ok)'};
const lvName = {low:'待加強', mid:'有基礎', high:'到位'};
function show(){
  const a = answers(); const sum = Object.values(a).reduce((x,y)=>x+y,0);
  const pct = Math.round(sum / maxScore * 100);
  const band = DATA.bands.find(b => pct >= b.min && pct <= b.max);
  const r = $('#result'); r.innerHTML = '';
  const head = document.createElement('div');
  head.innerHTML = `<div class="eyebrow">自評結果</div><div class="score"><span class="num">${pct}</span><span class="of">/ 100 分</span></div><h2 class="band"></h2><p class="summary"></p>`;
  head.querySelector('.band').textContent = band.name;
  head.querySelector('.summary').textContent = band.summary;
  r.append(head);
  const rows = document.createElement('div'); rows.className = 'rows';
  const dimScores = [];
  DATA.dimensions.forEach(d => {
    const qs = DATA.questions.filter(q => q.dimension === d.id);
    const s = qs.reduce((x,q)=>x+(a[q.id]||0),0), m = qs.length*3, lv = level(s/qs.length); dimScores.push(`${d.name} ${Math.round(s/m*100)}`);
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span class="name"></span><div class="meter"><i style="width:${s/m*100}%;background:${lvColor[lv]}"></i></div><span class="val">${Math.round(s/m*100)} 分</span><p class="fb"></p>`;
    row.querySelector('.name').textContent = d.name;
    const fb = row.querySelector('.fb');
    const tag = document.createElement('span'); tag.className='tag'; tag.style.color = lvColor[lv]; tag.textContent = lvName[lv];
    fb.append(DATA.dimension_feedback[d.id][lv], tag);
    rows.append(row);
  });
  r.append(rows);
  const h3 = document.createElement('h3'); h3.textContent = '建議的下一步'; r.append(h3);
  const ol = document.createElement('ol'); ol.className = 'steps';
  band.next_steps.forEach(s => { const li = document.createElement('li'); li.textContent = s; ol.append(li); });
  r.append(ol);
  const cta = document.createElement('div'); cta.className = 'cta'; cta.textContent = DATA.cta + ' '; const link = document.createElement('a'); link.href = 'https://docs.google.com/forms/d/e/1FAIpQLSeiIEt4LeP-rIitegCDqyVF-HGJbCDBkQgci7QhBOAWPyaF8w/viewform?' + new URLSearchParams({usp: 'pp_url', 'entry.658515327': String(pct), 'entry.1095725114': dimScores.join('、')}); link.target = '_blank'; link.rel = 'noopener'; link.textContent = '預約 30 分鐘免費診斷'; link.style.fontWeight = '700'; cta.append(link); r.append(cta);
  const note = document.createElement('p'); note.className = 'note'; note.textContent = '自評答案只存在你自己的瀏覽器裡，不會自動傳送給任何人。點「預約 30 分鐘免費診斷」時，分數會先帶進表單；只有你在表單按下送出，聯絡資料和分數才會送給我們。'; r.append(note);
  r.hidden = false; r.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
form.addEventListener('change', () => { update(); save(); });
$('#see').onclick = $('#see2').onclick = show;
$('#reset').onclick = () => { form.reset(); $('#result').hidden = true; update(); save(); };
$('#sample').onclick = () => {
  const sample = [3,2,2,2, 1,1,2,1, 2,2,2,0, 2,2,2, 1,0,1, 1,1,0];
  DATA.questions.forEach((q,i) => { const el = form.querySelector(`input[name="${q.id}"][value="${sample[i]}"]`); if (el) el.checked = true; });
  update(); save(); show();
};
try { const s = JSON.parse(localStorage.getItem('readiness') || '{}');
  Object.entries(s).forEach(([k,v]) => { const el = form.querySelector(`input[name="${k}"][value="${v}"]`); if (el) el.checked = true; }); } catch(e){}
update();
</script>
